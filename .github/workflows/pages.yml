name: Validate travel app

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f index.html
          test -f manifest.json
          test -f service-worker.js
          test -f css/app.css
          test -f js/core.js
          test -f js/trip-data.js
          test -f js/app.js
      - name: Check JavaScript syntax
        run: |
          node --check js/core.js
          node --check js/trip-data.js
          node --check js/app.js
